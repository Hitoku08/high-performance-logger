// EffectiveSink 落盘用的单条日志消息。EffectiveFormatter 负责序列化，decoder 负责反序列化。
// 字段编号一旦发布就不能修改，否则旧日志文件无法解码；新增字段只能追加新编号。
syntax = "proto3";
option optimize_for=LITE_RUNTIME;

package logger;

message EffectiveMsg{
    int32 level = 1;
    int64 timestamp = 2;
    uint32 pid = 3;
    uint32 tid = 4;
    int32 line = 5;
    string file_name = 6;
    string func_name = 7;
    string log_info = 8;
}